<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Z AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #24242c;
      background: #101016;
      direction: ltr;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ec4899;
    }

    .status {
      font-size: 13px;
      color: #8f8f9d;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px 120px;
      direction: rtl;
    }

    .welcome {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
    }

    .welcome-logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ec4899;
      font-size: 35px;
      font-weight: bold;
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.25);
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #92929e;
      line-height: 1.6;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
      direction: rtl;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: right;
    }

    .user .bubble {
      background: #ec4899;
      color: white;
      border-bottom-left-radius: 5px;
    }

    .ai .bubble {
      background: #17171f;
      border: 1px solid #282832;
      border-bottom-right-radius: 5px;
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px;
      background: linear-gradient(
        transparent,
        #0b0b0f 25%
      );
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      background: #15151c;
      border: 1px solid #30303a;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      direction: ltr;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      line-height: 1.5;
      min-height: 45px;
      max-height: 140px;
      padding: 10px;
      font-family: inherit;
      direction: rtl;
      text-align: right;
    }

    textarea::placeholder {
      color: #777784;
      text-align: right;
    }

    #send {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 14px;
      background: #ec4899;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: .2s;
      flex-shrink: 0;
    }

    #send:hover {
      transform: scale(1.05);
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      max-width: 850px;
      margin: 8px auto 0;
      text-align: center;
      color: #666673;
      font-size: 11px;
      direction: ltr;
    }

    .typing {
      opacity: .7;
      font-style: italic;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 15px;
      }

      .welcome {
        margin: 50px auto;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">Z <span>AI</span></div>
      <div class="status">AI Assistant</div>
    </header>

    <main class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="welcome-logo">Z</div>

        <h1>Welcome to Z AI</h1>

        <p>
          مساعدك الذكي جاهز.<br>
          اسأل أي حاجة وابدأ المحادثة.
        </p>
      </div>

    </main>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="message"
          placeholder="اكتب رسالتك إلى Z AI..."
          rows="1"
        ></textarea>

        <button id="send" type="button">➤</button>

      </div>

      <div class="hint">
        Z AI • Developed by ZIAD ALAA
      </div>

    </div>

  </div>

  <script>
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {
      if (welcome) {
        welcome.style.display = "none";
      }

      const message = document.createElement("div");
      message.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();

      if (!text || sendButton.disabled) {
        return;
      }

      addMessage(text, "user");

      messageInput.value = "";
      messageInput.style.height = "45px";

      sendButton.disabled = true;

      const typingMessage = addMessage("جاري التفكير... 🤖", "ai");
      typingMessage.querySelector(".bubble").classList.add("typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        typingMessage.remove();

        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ في الاتصال");
        }

        addMessage(data.reply, "ai");

      } catch (error) {

        typingMessage.remove();

        addMessage(
          "حصل خطأ في الاتصال بـ Gemini.\n\n" +
          "التفاصيل: " + error.message,
          "ai"
        );

      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }

    });

    messageInput.addEventListener("input", function() {
      this.style.height = "45px";
      this.style.height =
        Math.min(this.scrollHeight, 140) + "px";
    });
  </script>

</body>
</html>
