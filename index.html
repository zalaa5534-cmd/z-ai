<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Z AI</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    :root {
      --pink: #ec4899;
      --pink-dark: #db2777;
      --bg: #0b0b0f;
      --sidebar: #101016;
      --card: #15151c;
      --card-hover: #1c1c25;
      --border: #292933;
      --text: #f4f4f5;
      --muted: #8f8f9d;
      --muted2: #686875;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family:
        Arial,
        "Segoe UI",
        Tahoma,
        sans-serif;

      color: var(--text);
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       APP
    ========================================= */

    .app {
      width: 100%;
      height: 100dvh;

      display: flex;

      background: var(--bg);

      overflow: hidden;
    }

    /* =========================================
       SIDEBAR
    ========================================= */

    .sidebar {
      width: 270px;
      height: 100%;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);

      border-right: 1px solid var(--border);

      transition:
        transform 0.25s ease,
        width 0.25s ease;
    }

    .sidebar-top {
      padding: 14px;
    }

    .brand {
      height: 48px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 10px;

      margin-bottom: 12px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: var(--pink);

      color: white;

      font-size: 19px;
      font-weight: 800;

      box-shadow:
        0 0 25px rgba(236, 72, 153, 0.2);
    }

    .brand-name {
      direction: ltr;

      font-size: 20px;
      font-weight: 700;
    }

    .brand-name span {
      color: var(--pink);
    }

    .new-chat {
      width: 100%;
      height: 46px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: #14141b;

      color: white;

      cursor: pointer;

      font-size: 14px;

      transition: 0.2s;
    }

    .new-chat:hover {
      background: var(--card-hover);
      border-color: #393944;
    }

    .new-chat-icon {
      font-size: 21px;
      color: var(--pink);
    }

    /* =========================================
       CHAT LIST
    ========================================= */

    .chat-list-title {
      padding: 12px 18px 8px;

      color: var(--muted2);

      font-size: 11px;

      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .chat-list {
      flex: 1;

      overflow-y: auto;

      padding: 0 10px 12px;
    }

    .chat-list::-webkit-scrollbar {
      width: 5px;
    }

    .chat-list::-webkit-scrollbar-thumb {
      background: #30303a;
      border-radius: 20px;
    }

    .chat-item {
      width: 100%;

      min-height: 44px;

      display: flex;
      align-items: center;

      padding: 0 11px;

      margin-bottom: 4px;

      border: 1px solid transparent;
      border-radius: 10px;

      background: transparent;

      color: #d7d7df;

      cursor: pointer;

      text-align: left;

      transition: 0.18s;
    }

    .chat-item:hover {
      background: var(--card-hover);
    }

    .chat-item.active {
      background: #1b1b24;
      border-color: #292934;
    }

    .chat-item-icon {
      width: 25px;

      flex-shrink: 0;

      color: var(--muted);

      font-size: 15px;
    }

    .chat-item-title {
      flex: 1;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 13px;
    }

    .empty-chats {
      padding: 25px 15px;

      text-align: center;

      color: var(--muted2);

      font-size: 12px;

      line-height: 1.6;
    }

    /* =========================================
       SIDEBAR BOTTOM
    ========================================= */

    .sidebar-bottom {
      padding: 10px;

      border-top: 1px solid var(--border);
    }

    .user-card {
      min-height: 54px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 7px 9px;

      border-radius: 11px;

      background: transparent;
    }

    .user-avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #272732;

      color: white;

      font-size: 14px;
      font-weight: 700;
    }

    .user-info {
      flex: 1;

      min-width: 0;
    }

    .user-name {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      color: white;

      font-size: 13px;
    }

    .user-status {
      margin-top: 3px;

      color: var(--muted2);

      font-size: 10px;
    }

    .login-button {
      width: 100%;
      height: 42px;

      border: 1px solid #343440;
      border-radius: 10px;

      background: #181820;

      color: white;

      cursor: pointer;

      font-size: 13px;

      transition: 0.2s;
    }

    .login-button:hover {
      border-color: var(--pink);
      background: #211720;
    }

    /* =========================================
       MAIN
    ========================================= */

    .main {
      min-width: 0;

      flex: 1;

      height: 100%;

      display: flex;
      flex-direction: column;

      position: relative;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      height: 62px;

      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 0 18px;

      border-bottom: 1px solid var(--border);

      background: rgba(16, 16, 22, 0.94);

      backdrop-filter: blur(12px);

      z-index: 10;
    }

    .mobile-menu {
      width: 40px;
      height: 40px;

      display: none;

      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 9px;

      background: transparent;

      color: white;

      font-size: 22px;

      cursor: pointer;
    }

    .mobile-menu:hover {
      background: var(--card-hover);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 15px;
      font-weight: 600;
    }

    .header-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--pink);

      box-shadow:
        0 0 12px rgba(236, 72, 153, 0.5);
    }

    .header-actions {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 7px;
    }

    .header-button {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid transparent;
      border-radius: 9px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      font-size: 17px;

      transition: 0.2s;
    }

    .header-button:hover {
      background: var(--card-hover);
      color: white;
    }

    /* =========================================
       CHAT
    ========================================= */

    .chat {
      flex: 1;

      min-height: 0;

      width: 100%;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        30px
        18px
        190px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;
    }

    .chat::-webkit-scrollbar {
      width: 7px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #30303a;
      border-radius: 20px;
    }

    /* =========================================
       WELCOME
    ========================================= */

    .welcome {
      max-width: 720px;

      margin: 100px auto 0;

      text-align: center;
    }

    .welcome-logo {
      width: 76px;
      height: 76px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 23px;

      background: var(--pink);

      color: white;

      font-size: 36px;
      font-weight: 800;

      box-shadow:
        0 0 50px rgba(236, 72, 153, 0.22);
    }

    .welcome h1 {
      margin-bottom: 10px;

      font-size: 31px;
    }

    .welcome p {
      color: var(--muted);

      font-size: 15px;

      line-height: 1.8;
    }

    /* =========================================
       MESSAGE
    ========================================= */

    .message {
      width: 100%;

      max-width: 850px;

      margin: 0 auto 30px;

      display: flex;

      animation: messageIn 0.18s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .user .bubble {
      max-width: min(78%, 650px);

      padding: 12px 17px;

      border-radius: 19px;
      border-bottom-right-radius: 6px;

      background: var(--pink);

      color: white;

      font-size: 16px;

      line-height: 1.65;

      white-space: pre-wrap;

      word-break: break-word;

      box-shadow:
        0 4px 20px rgba(236, 72, 153, 0.1);
    }

    .message.ai {
      justify-content: flex-start;
    }

    .ai-content {
      width: 100%;

      max-width: 850px;

      color: #f4f4f5;

      font-size: 16px;

      line-height: 1.8;

      word-break: break-word;
    }

    .ai-content p {
      margin: 0 0 18px;
    }

    .ai-content p:last-child {
      margin-bottom: 0;
    }

    .ai-content h1,
    .ai-content h2,
    .ai-content h3,
    .ai-content h4 {
      margin: 25px 0 12px;

      color: white;

      line-height: 1.4;
    }

    .ai-content h1 {
      font-size: 26px;
    }

    .ai-content h2 {
      font-size: 22px;
    }

    .ai-content h3 {
      font-size: 19px;
    }

    .ai-content h4 {
      font-size: 17px;
    }

    .ai-content strong {
      color: white;
    }

    .ai-content ul,
    .ai-content ol {
      margin: 10px 0 20px;

      padding-left: 25px;
    }

    .ai-content li {
      margin: 7px 0;
    }

    .ai-content blockquote {
      margin: 18px 0;

      padding: 10px 16px;

      border-left: 3px solid var(--pink);

      background: rgba(255,255,255,0.025);

      color: #b8b8c4;
    }

    .ai-content a {
      color: var(--pink);
      text-decoration: none;
    }

    .ai-content a:hover {
      text-decoration: underline;
    }

    /* =========================================
       CODE
    ========================================= */

    .ai-content code:not(pre code) {
      display: inline-block;

      padding: 2px 7px;

      border-radius: 6px;

      background: #191922;

      border: 1px solid #2b2b36;

      color: #f3a1ca;

      font-family:
        Consolas,
        Monaco,
        monospace;

      font-size: 14px;

      direction: ltr;
    }

    .code-wrapper {
      width: 100%;

      margin: 18px 0;

      overflow: hidden;

      border: 1px solid #2b2b35;

      border-radius: 12px;

      background: #101016;

      direction: ltr;
    }

    .code-header {
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;

      background: #17171f;

      border-bottom: 1px solid #2b2b35;
    }

    .code-language {
      color: #9a9aa7;

      font-size: 12px;
    }

    .copy-code {
      padding: 6px 10px;

      border: 1px solid #383844;
      border-radius: 7px;

      background: #20202a;

      color: #d7d7df;

      cursor: pointer;

      font-size: 12px;
    }

    .copy-code.copied {
      background: var(--pink);
      border-color: var(--pink);
      color: white;
    }

    .code-wrapper pre {
      margin: 0;

      padding: 16px;

      overflow-x: auto;

      text-align: left;

      direction: ltr;
    }

    .code-wrapper pre code {
      display: block;

      min-width: max-content;

      padding: 0;

      border: none;

      background: transparent;

      color: #e7e7ee;

      font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;

      font-size: 13px;

      line-height: 1.65;

      white-space: pre;
    }

    /* =========================================
       ATTACHMENTS
    ========================================= */

    .attachment-preview {
      max-width: 850px;

      margin: 0 auto 12px;

      display: none;

      gap: 8px;

      flex-wrap: wrap;
    }

    .attachment-preview.visible {
      display: flex;
    }

    .attachment {
      max-width: 230px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 10px;

      border: 1px solid var(--border);

      border-radius: 10px;

      background: #15151c;

      color: #ddd;

      font-size: 12px;
    }

    .attachment-name {
      max-width: 170px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .remove-attachment {
      border: none;

      background: transparent;

      color: #999;

      cursor: pointer;

      font-size: 15px;
    }

    .remove-attachment:hover {
      color: #ff6f9f;
    }

    /* =========================================
       INPUT
    ========================================= */

    .input-area {
      position: fixed;

      left: 270px;
      right: 0;
      bottom: 0;

      z-index: 20;

      padding:
        16px
        18px
        calc(15px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(11,11,15,0.96) 35%,
          var(--bg) 60%
        );
    }

    .input-box {
      width: 100%;

      max-width: 850px;

      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 7px;

      padding: 8px;

      border: 1px solid #30303a;

      border-radius: 19px;

      background: #15151c;

      box-shadow:
        0 12px 45px rgba(0,0,0,0.4);
    }

    .input-button {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      cursor: pointer;

      font-size: 19px;

      transition: 0.2s;
    }

    .input-button:hover {
      background: #20202a;
      color: white;
    }

    .input-button.active {
      color: var(--pink);
    }

    textarea {
      flex: 1;

      width: 100%;

      min-height: 44px;
      max-height: 150px;

      resize: none;

      outline: none;
      border: none;

      background: transparent;

      color: white;

      font-size: 16px;

      line-height: 1.5;

      padding: 10px 5px;

      overflow-y: auto;
    }

    textarea::placeholder {
      color: #777784;
    }

    #send {
      width: 44px;
      height: 44px;

      flex: 0 0 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 13px;

      background: var(--pink);

      color: white;

      cursor: pointer;

      font-size: 20px;

      transition: 0.2s;
    }

    #send:hover {
      background: var(--pink-dark);

      transform: scale(1.04);
    }

    #send:disabled {
      opacity: 0.45;

      cursor: not-allowed;

      transform: none;
    }

    .hint {
      max-width: 850px;

      margin: 7px auto 0;

      text-align: center;

      color: #60606c;

      font-size: 10px;
    }

    /* =========================================
       TYPING
    ========================================= */

    .typing {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      min-height: 25px;
    }

    .typing span {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #8d8d99;

      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================================
       MOBILE OVERLAY
    ========================================= */

    .sidebar-overlay {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 80;

      background: rgba(0,0,0,0.58);
    }

    /* =========================================
       ERROR
    ========================================= */

    .error-message {
      color: #ff8eaa;

      line-height: 1.7;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 800px) {

      .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        z-index: 90;

        transform: translateX(-100%);

        box-shadow:
          10px 0 40px rgba(0,0,0,0.45);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .mobile-menu {
        display: flex;
      }

      .header {
        height: 60px;

        padding: 0 10px;
      }

      .input-area {
        left: 0;

        padding:
          12px
          10px
          calc(10px + env(safe-area-inset-bottom));
      }

      .chat {
        padding:
          22px
          12px
          185px;
      }

      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .user .bubble {
        max-width: 88%;
      }

      .ai-content {
        font-size: 16px;
      }
    }

    @media (max-width: 430px) {

      .header-title {
        font-size: 14px;
      }

      .welcome-logo {
        width: 68px;
        height: 68px;

        font-size: 32px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .input-box {
        border-radius: 17px;

        padding: 7px;
      }

      .input-button {
        width: 39px;
        height: 39px;

        flex-basis: 39px;
      }

      #send {
        width: 42px;
        height: 42px;

        flex-basis: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================================
         MOBILE OVERLAY
    ========================================== -->

    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
    ></div>


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-logo">
            Z
          </div>

          <div class="brand-name">
            Z <span>AI</span>
          </div>

        </div>


        <button
          class="new-chat"
          id="newChat"
          type="button"
        >

          <span class="new-chat-icon">
            ＋
          </span>

          <span>
            New chat
          </span>

        </button>

      </div>


      <div class="chat-list-title">
        Conversations
      </div>


      <div
        class="chat-list"
        id="chatList"
      >

        <div class="empty-chats">
          Your conversations will appear here.
        </div>

      </div>


      <div class="sidebar-bottom">

        <div
          class="user-card"
          id="userCard"
        >

          <div
            class="user-avatar"
            id="userAvatar"
          >
            Z
          </div>

          <div class="user-info">

            <div
              class="user-name"
              id="userName"
            >
              Guest
            </div>

            <div
              class="user-status"
              id="userStatus"
            >
              Sign in with Google
            </div>

          </div>

        </div>


        <button
          class="login-button"
          id="loginButton"
          type="button"
        >
          Continue with Google
        </button>

      </div>

    </aside>


    <!-- =========================================
         MAIN
    ========================================== -->

    <section class="main">


      <!-- =======================================
           HEADER
      ======================================== -->

      <header class="header">

        <button
          class="mobile-menu"
          id="mobileMenu"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>


        <div class="header-title">

          <span class="header-dot"></span>

          <span id="headerTitle">
            New chat
          </span>

        </div>


        <div class="header-actions">

          <button
            class="header-button"
            id="newChatTop"
            type="button"
            title="New chat"
          >
            ＋
          </button>

        </div>

      </header>


      <!-- =======================================
           CHAT
      ======================================== -->

      <main
        class="chat"
        id="chat"
        aria-live="polite"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            Z
          </div>

          <h1>
            Welcome to Z AI
          </h1>

          <p>
            Your intelligent assistant.<br>
            Ask anything and start a conversation.
          </p>

        </div>

      </main>


      <!-- =======================================
           INPUT AREA
      ======================================== -->

      <div class="input-area">


        <!-- Attachments -->

        <div
          class="attachment-preview"
          id="attachmentPreview"
        ></div>


        <!-- Input -->

        <div class="input-box">


          <!-- File -->

          <button
            class="input-button"
            id="attachButton"
            type="button"
            title="Attach files"
          >
            📎
          </button>

          <input
            id="fileInput"
            type="file"
            multiple
            hidden
          />


          <!-- Image generation -->

          <button
            class="input-button"
            id="imageButton"
            type="button"
            title="Generate image"
          >
            ✨
          </button>


          <!-- Text -->

          <textarea
            id="message"
            placeholder="Message Z AI..."
            rows="1"
            autocomplete="off"
          ></textarea>


          <!-- Send -->

          <button
            id="send"
            type="button"
            aria-label="Send message"
          >
            ➤
          </button>

        </div>


        <div class="hint">
          Z AI • Developed by ZIAD Alaa Zakii
        </div>

      </div>

    </section>

  </div>


  <script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const messageInput =
      document.getElementById("message");

    const sendButton =
      document.getElementById("send");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");

    const chatList =
      document.getElementById("chatList");

    const newChat =
      document.getElementById("newChat");

    const newChatTop =
      document.getElementById("newChatTop");

    const headerTitle =
      document.getElementById("headerTitle");

    const mobileMenu =
      document.getElementById("mobileMenu");

    const sidebar =
      document.getElementById("sidebar");

    const sidebarOverlay =
      document.getElementById("sidebarOverlay");

    const attachButton =
      document.getElementById("attachButton");

    const fileInput =
      document.getElementById("fileInput");

    const attachmentPreview =
      document.getElementById("attachmentPreview");

    const imageButton =
      document.getElementById("imageButton");

    const loginButton =
      document.getElementById("loginButton");

    const userName =
      document.getElementById("userName");

    const userStatus =
      document.getElementById("userStatus");

    const userAvatar =
      document.getElementById("userAvatar");


    /* =========================================
       STATE
    ========================================= */

    let currentChatId = null;

    let chats = [];

    let selectedFiles = [];

    let sending = false;


    /* =========================================
       MARKDOWN
    ========================================= */

    marked.setOptions({
      breaks: true,
      gfm: true
    });


    /* =========================================
       SIDEBAR
    ========================================= */

    function openSidebar() {

      sidebar.classList.add("open");

      sidebarOverlay.classList.add("open");

    }


    function closeSidebar() {

      sidebar.classList.remove("open");

      sidebarOverlay.classList.remove("open");

    }


    mobileMenu.addEventListener(
      "click",
      openSidebar
    );


    sidebarOverlay.addEventListener(
      "click",
      closeSidebar
    );


    /* =========================================
       SCROLL
    ========================================= */

    function scrollToBottom(
      smooth = true
    ) {

      requestAnimationFrame(() => {

        chat.scrollTo({
          top: chat.scrollHeight,
          behavior: smooth
            ? "smooth"
            : "auto"
        });

      });

    }


    /* =========================================
       WELCOME
    ========================================= */

    function hideWelcome() {

      const currentWelcome =
        document.getElementById("welcome");

      if (currentWelcome) {
        currentWelcome.remove();
      }

    }


    /* =========================================
       CHAT TITLE
    ========================================= */

    function createChatTitle(text) {

      const clean =
        text
          .replace(/\s+/g, " ")
          .trim();

      if (!clean) {
        return "New chat";
      }

      if (clean.length <= 35) {
        return clean;
      }

      return clean.substring(0, 35) + "...";

    }


    /* =========================================
       NEW CHAT
    ========================================= */

    function startNewChat() {

      currentChatId = null;

      chat.innerHTML = `
        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            Z
          </div>

          <h1>
            Welcome to Z AI
          </h1>

          <p>
            Your intelligent assistant.<br>
            Ask anything and start a conversation.
          </p>

        </div>
      `;

      headerTitle.textContent =
        "New chat";

      selectedFiles = [];

      renderAttachments();

      closeSidebar();

      messageInput.focus();

    }


    newChat.addEventListener(
      "click",
      startNewChat
    );


    newChatTop.addEventListener(
      "click",
      startNewChat
    );


    /* =========================================
       USER MESSAGE
    ========================================= */

    function addUserMessage(text) {

      hideWelcome();

      const message =
        document.createElement("div");

      message.className =
        "message user";

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;

      message.appendChild(
        bubble
      );

      chat.appendChild(
        message
      );

      scrollToBottom();

    }


    /* =========================================
       AI MESSAGE
    ========================================= */

    function addAIMessage(text) {

      hideWelcome();

      const message =
        document.createElement("div");

      message.className =
        "message ai";

      const content =
        document.createElement("div");

      content.className =
        "ai-content";

      renderMarkdown(
        content,
        text
      );

      message.appendChild(
        content
      );

      chat.appendChild(
        message
      );

      addCopyButtons(
        content
      );

      scrollToBottom();

      return content;

    }


    /* =========================================
       MARKDOWN
    ========================================= */

    function renderMarkdown(
      element,
      text
    ) {

      try {

        const html =
          marked.parse(
            text || ""
          );

        element.innerHTML =
          DOMPurify.sanitize(
            html,
            {
              USE_PROFILES: {
                html: true
              }
            }
          );

        convertCodeBlocks(
          element
        );

      } catch (error) {

        console.error(
          "Markdown error:",
          error
        );

        element.textContent =
          text;

      }

    }


    /* =========================================
       CODE BLOCKS
    ========================================= */

    function convertCodeBlocks(
      container
    ) {

      const blocks =
        container.querySelectorAll(
          "pre"
        );

      blocks.forEach(
        (pre) => {

          const code =
            pre.querySelector(
              "code"
            );

          if (!code) {
            return;
          }

          const wrapper =
            document.createElement(
              "div"
            );

          wrapper.className =
            "code-wrapper";

          const header =
            document.createElement(
              "div"
            );

          header.className =
            "code-header";

          const language =
            document.createElement(
              "span"
            );

          language.className =
            "code-language";

          let lang =
            "code";

          const className =
            code.className || "";

          const match =
            className.match(
              /language-([^\s]+)/
            );

          if (match) {
            lang = match[1];
          }

          language.textContent =
            lang;

          const copy =
            document.createElement(
              "button"
            );

          copy.className =
            "copy-code";

          copy.type =
            "button";

          copy.textContent =
            "Copy";

          header.appendChild(
            language
          );

          header.appendChild(
            copy
          );

          wrapper.appendChild(
            header
          );

          wrapper.appendChild(
            pre
          );

          pre.parentNode.replaceChild(
            wrapper,
            pre
          );

        }
      );

    }


    /* =========================================
       COPY
    ========================================= */

    function addCopyButtons(
      container
    ) {

      const buttons =
        container.querySelectorAll(
          ".copy-code"
        );

      buttons.forEach(
        (button) => {

          button.addEventListener(
            "click",
            async () => {

              const wrapper =
                button.closest(
                  ".code-wrapper"
                );

              const code =
                wrapper?.querySelector(
                  "pre code"
                );

              if (!code) {
                return;
              }

              try {

                await navigator.clipboard.writeText(
                  code.textContent
                );

                button.textContent =
                  "Copied!";

                button.classList.add(
                  "copied"
                );

                setTimeout(
                  () => {

                    button.textContent =
                      "Copy";

                    button.classList.remove(
                      "copied"
                    );

                  },
                  1500
                );

              } catch (error) {

                console.error(
                  "Copy failed:",
                  error
                );

              }

            }
          );

        }
      );

    }


    /* =========================================
       TYPING
    ========================================= */

    function showTyping() {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message ai";

      message.id =
        "typing-message";

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "ai-content";

      const typing =
        document.createElement(
          "div"
        );

      typing.className =
        "typing";

      typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
      `;

      content.appendChild(
        typing
      );

      message.appendChild(
        content
      );

      chat.appendChild(
        message
      );

      scrollToBottom();

    }


    function removeTyping() {

      const typing =
        document.getElementById(
          "typing-message"
        );

      if (typing) {
        typing.remove();
      }

    }


    /* =========================================
       FILE ATTACHMENT
    ========================================= */

    attachButton.addEventListener(
      "click",
      () => {

        fileInput.click();

      }
    );


    fileInput.addEventListener(
      "change",
      () => {

        selectedFiles =
          Array.from(
            fileInput.files || []
          );

        renderAttachments();

      }
    );


    function renderAttachments() {

      attachmentPreview.innerHTML =
        "";

      if (
        !selectedFiles.length
      ) {

        attachmentPreview.classList.remove(
          "visible"
        );

        return;

      }

      attachmentPreview.classList.add(
        "visible"
      );


      selectedFiles.forEach(
        (file, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "attachment";

          const icon =
            document.createElement(
              "span"
            );

          icon.textContent =
            file.type.startsWith(
              "image/"
            )
              ? "🖼️"
              : "📄";

          const name =
            document.createElement(
              "span"
            );

          name.className =
            "attachment-name";

          name.textContent =
            file.name;

          const remove =
            document.createElement(
              "button"
            );

          remove.className =
            "remove-attachment";

          remove.type =
            "button";

          remove.textContent =
            "×";

          remove.addEventListener(
            "click",
            () => {

              selectedFiles.splice(
                index,
                1
              );

              renderAttachments();

            }
          );

          item.appendChild(
            icon
          );

          item.appendChild(
            name
          );

          item.appendChild(
            remove
          );

          attachmentPreview.appendChild(
            item
          );

        }
      );

    }


    /* =========================================
       IMAGE GENERATION BUTTON
    ========================================= */

    imageButton.addEventListener(
      "click",
      () => {

        imageButton.classList.toggle(
          "active"
        );

        if (
          imageButton.classList.contains(
            "active"
          )
        ) {

          messageInput.placeholder =
            "Describe the image you want Z AI to create...";

          messageInput.focus();

        } else {

          messageInput.placeholder =
            "Message Z AI...";

        }

      }
    );


    /* =========================================
       SEND
    ========================================= */

    async function sendMessage() {

      if (sending) {
        return;
      }

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }

      sending = true;

      sendButton.disabled =
        true;


      /*
        Create a local chat session.

        Firebase will replace this temporary
        storage in the next stage.
      */

      if (!currentChatId) {

        currentChatId =
          "local-" +
          Date.now();

        const newConversation = {
          id: currentChatId,
          title: createChatTitle(text),
          messages: [],
          createdAt: Date.now()
        };

        chats.unshift(
          newConversation
        );

        headerTitle.textContent =
          newConversation.title;

        renderChatList();

      }


      addUserMessage(
        text
      );


      const currentChat =
        chats.find(
          (item) =>
            item.id === currentChatId
        );

      if (currentChat) {

        currentChat.messages.push({
          role: "user",
          content: text
        });

      }


      messageInput.value =
        "";

      messageInput.style.height =
        "44px";


      showTyping();


      try {

        /*
          For now this keeps the existing
          /api/chat endpoint.

          Later we will replace the backend
          with the complete OpenAI + Firebase
          system.
        */

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: text
              })
            }
          );


        const data =
          await response.json();


        removeTyping();


        if (
          !response.ok
        ) {

          throw new Error(
            data?.error ||
            "AI request failed."
          );

        }


        const reply =
          data?.reply;


        if (!reply) {

          throw new Error(
            "No response received from AI."
          );

        }


        addAIMessage(
          reply
        );


        if (currentChat) {

          currentChat.messages.push({
            role: "assistant",
            content: reply
          });

        }


      } catch (error) {

        console.error(
          error
        );

        removeTyping();


        addAIMessage(
          "حدث خطأ في الاتصال بالذكاء الاصطناعي.\n\n" +
          error.message
        );

      } finally {

        sending = false;

        sendButton.disabled =
          false;

        messageInput.focus();

      }

    }


    /* =========================================
       SEND BUTTON
    ========================================= */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================================
       ENTER
    ========================================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================================
       TEXTAREA HEIGHT
    ========================================= */

    messageInput.addEventListener(
      "input",
      function() {

        this.style.height =
          "44px";

        this.style.height =
          Math.min(
            this.scrollHeight,
            150
          ) + "px";

      }
    );


    /* =========================================
       CHAT LIST
    ========================================= */

    function renderChatList() {

      chatList.innerHTML =
        "";

      if (
        !chats.length
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty-chats";

        empty.textContent =
          "Your conversations will appear here.";

        chatList.appendChild(
          empty
        );

        return;

      }


      chats.forEach(
        (conversation) => {

          const item =
            document.createElement(
              "button"
            );

          item.type =
            "button";

          item.className =
            "chat-item";


          if (
            conversation.id ===
            currentChatId
          ) {

            item.classList.add(
              "active"
            );

          }


          const icon =
            document.createElement(
              "span"
            );

          icon.className =
            "chat-item-icon";

          icon.textContent =
            "💬";


          const title =
            document.createElement(
              "span"
            );

          title.className =
            "chat-item-title";

          title.textContent =
            conversation.title;


          item.appendChild(
            icon
          );

          item.appendChild(
            title
          );


          item.addEventListener(
            "click",
            () => {

              openConversation(
                conversation.id
              );

            }
          );


          chatList.appendChild(
            item
          );

        }
      );

    }


    /* =========================================
       OPEN CONVERSATION
    ========================================= */

    function openConversation(
      id
    ) {

      const conversation =
        chats.find(
          (item) =>
            item.id === id
        );

      if (!conversation) {
        return;
      }


      currentChatId =
        conversation.id;


      headerTitle.textContent =
        conversation.title;


      chat.innerHTML =
        "";


      conversation.messages.forEach(
        (message) => {

          if (
            message.role ===
            "user"
          ) {

            addUserMessage(
              message.content
            );

          } else {

            addAIMessage(
              message.content
            );

          }

        }
      );


      renderChatList();

      closeSidebar();

      scrollToBottom(
        false
      );

    }


    /* =========================================
       GOOGLE LOGIN UI
    ========================================= */

    loginButton.addEventListener(
      "click",
      () => {

        /*
          Firebase Google Authentication
          will be connected in the next stage.
        */

        alert(
          "Google Sign-In will be connected in the Firebase stage."
        );

      }
    );


    /* =========================================
       TEMPORARY USER UI
    ========================================= */

    function setGuestUser() {

      userName.textContent =
        "Guest";

      userStatus.textContent =
        "Sign in with Google";

      userAvatar.textContent =
        "Z";

      loginButton.style.display =
        "block";

    }


    setGuestUser();


    /* =========================================
       INITIAL
    ========================================= */

    renderChatList();

    messageInput.focus();

  </script>

</body>
  </html>
